<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Examen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="quiz-container">
    <h1>Simulador de Examen</h1>
    <div id="timer">Tiempo: 0s</div>
    <div id="question-container"></div>
    <button id="next-btn" style="display:none;">Siguiente</button>
    <button id="finish-btn" style="display:none;">Finalizar</button>
    <button id="start-btn">Iniciar Examen</button>
    <div id="result"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
