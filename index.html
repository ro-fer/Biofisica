<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BioGeeks | Quiz de Biofísica</title>
  <meta name="description" content="Práctica de Biofísica por módulos con seguimiento local de resultados.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Volver a BioGeeks">
      <span class="brand-mark">🧬</span>
      <span>Biofisica</span>
    </a>
    <button id="resetProgressBtn" class="ghost-btn" type="button">Reiniciar progreso</button>
  </header>

  <main class="app-shell">
    <section class="hero">
      <p class="eyebrow">Biofísica · práctica activa</p>
      <h1>Banco de preguntas</h1>
      <p class="hero-copy">
        Elegí un módulo, respondé sin mirar la clave y usá los resultados para decidir qué repasar.
      </p>
      <div id="moduleCards" class="module-grid" aria-label="Módulos disponibles"></div>
    </section>

    <section id="quizPanel" class="quiz-panel hidden" aria-live="polite">
      <div class="quiz-head">
        <div>
          <p id="moduleLabel" class="eyebrow"></p>
          <h2 id="questionCounter"></h2>
        </div>
        <div class="progress-wrap" aria-label="Progreso">
          <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
          <span id="progressText"></span>
        </div>
      </div>

      <article class="question-card">
        <p id="questionType" class="question-type"></p>
        <h3 id="questionPrompt"></h3>
        <form id="optionsForm" class="options"></form>

        <div id="feedback" class="feedback hidden"></div>

        <div class="quiz-actions">
          <button id="checkBtn" class="primary-btn" type="button">Corregir</button>
          <button id="nextBtn" class="secondary-btn hidden" type="button">Siguiente</button>
          <button id="exitBtn" class="ghost-btn" type="button">Salir del módulo</button>
        </div>
      </article>
    </section>

    <section id="resultsPanel" class="results-panel hidden">
      <p class="eyebrow">Resultado</p>
      <h2 id="resultTitle"></h2>
      <div id="resultStats" class="stats-grid"></div>
      <div class="result-actions">
        <button id="retryErrorsBtn" class="primary-btn" type="button">Repetir errores</button>
        <button id="backModulesBtn" class="secondary-btn" type="button">Volver a módulos</button>
      </div>
    </section>

    <section class="study-panel">
      <div>
        <p class="eyebrow">Tu hoja de ruta</p>
        <h2>Qué conviene revisar</h2>
      </div>
      <div id="studySummary" class="study-summary"></div>
    </section>
  </main>

  <template id="moduleCardTemplate">
    <button class="module-card" type="button">
      <span class="module-number"></span>
      <strong class="module-title"></strong>
      <span class="module-meta"></span>
      <span class="module-score"></span>
    </button>
  </template>

  <script src="script.js?v=5" defer></script>
</body>
</html>
